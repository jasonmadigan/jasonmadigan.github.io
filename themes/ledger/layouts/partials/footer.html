<footer class="site-footer">
  <span>{{ site.Params.author }}{{ with site.Params.since }} · Since {{ . }}{{ end }}</span>
  <nav aria-label="Elsewhere">
    {{ range site.Params.social }}<a href="{{ .url }}" rel="me">{{ if eq .name "github" }}GitHub{{ else }}{{ .name }}{{ end }}</a>{{ end }}
    {{ with site.Params.email }}<a href="mailto:{{ . }}">Email</a>{{ end }}
    <a href="{{ "index.xml" | relURL }}">RSS</a>
  </nav>
</footer>
